<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151615">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kelime">
  <title>Kelime Defteri</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=18">
</head>
<body>
  <main class="card" id="card">
    <header class="top">
      <div class="streak" title="Art arda çalıştığın gün sayısı">
        <span id="streak">0</span> <span class="unit">Tage in Folge</span>
      </div>
      <div class="top-right">
        <button class="cost" id="costBtn" title="Muse Ember maliyeti (tahmini) — dokun: bugün / bu ay / toplam">
          <b id="costVal">0,000 $</b><span id="costLbl">heute</span>
        </button>
      <button class="btn icon" id="menuBtn" aria-label="Menü">
        <svg viewBox="0 0 10 8" width="14" height="12" shape-rendering="crispEdges"><rect y="0" width="10" height="1.4"/><rect y="3.3" width="10" height="1.4"/><rect y="6.6" width="10" height="1.4"/></svg>
      </button>
      </div>
    </header>

    <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

    <div class="top-area" id="topArea">
      <div class="stats-col">
      <div class="count"><em id="total">0 / 500</em> <span>Wörter</span></div>
      <div class="meter">
        <span class="meter-label" id="totalPct">%0</span>
        <div class="bar"><i id="totalBar"></i></div>
      </div>
      <div class="meter daily">
        <span class="meter-label">heute <b id="today">0 / 10</b></span>
        <div class="bar"><i id="dailyBar"></i></div>
      </div>
      </div>
      <section class="reader" id="reader" aria-label="Buch" hidden></section>
    </div>

    <section class="stage" id="stage">
      <div class="bubble" id="bubble" hidden></div>
      <div class="thought" id="thought" hidden></div>
      <canvas id="scene" aria-label="Masada çalışan küçük karakter"></canvas>
    </section>

    <footer class="bottom">
      <button class="btn icon" id="pauseBtn" aria-label="Duraklat">
        <svg class="i-pause" viewBox="0 0 8 8" width="11" height="11" shape-rendering="crispEdges"><rect x="1" y="0" width="2" height="8"/><rect x="5" y="0" width="2" height="8"/></svg>
        <svg class="i-play" viewBox="0 0 8 8" width="11" height="11" shape-rendering="crispEdges"><rect x="1" y="0" width="2" height="8"/><rect x="3" y="1" width="2" height="6"/><rect x="5" y="2" width="2" height="4"/><rect x="7" y="3" width="1" height="2"/></svg>
      </button>
      <button class="btn icon" id="askBtn" aria-label="Bana şimdi sor">
        <svg viewBox="0 0 8 10" width="9" height="12" shape-rendering="crispEdges"><rect x="2" y="0" width="4" height="1"/><rect x="1" y="1" width="2" height="1"/><rect x="5" y="1" width="2" height="3"/><rect x="4" y="4" width="2" height="1"/><rect x="3" y="5" width="2" height="2"/><rect x="3" y="8" width="2" height="2"/></svg>
      </button>
      <button class="btn icon" id="bookBtn" aria-label="Kitabı aç/kapat" aria-pressed="false">
        <svg viewBox="0 0 12 10" width="14" height="12" shape-rendering="crispEdges"><rect x="0" y="1" width="1" height="8"/><rect x="1" y="1" width="4" height="1"/><rect x="1" y="9" width="4" height="1"/><rect x="5" y="2" width="2" height="8"/><rect x="7" y="1" width="4" height="1"/><rect x="7" y="9" width="4" height="1"/><rect x="11" y="1" width="1" height="8"/><rect x="2" y="4" width="2" height="1"/><rect x="8" y="4" width="2" height="1"/><rect x="2" y="6" width="2" height="1"/><rect x="8" y="6" width="2" height="1"/></svg>
      </button>
      <form class="word-form" id="wordForm" autocomplete="off">
        <input id="wordInput" type="text" placeholder="Wort eingeben… (tr / de)" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" maxlength="60">
        <button class="btn icon" type="submit" aria-label="Gönder">
          <svg viewBox="0 0 10 8" width="13" height="11" shape-rendering="crispEdges"><rect x="8" y="0" width="1.5" height="5"/><rect x="1" y="3.5" width="8" height="1.5"/><rect x="2" y="2" width="1.5" height="4.5"/><rect x="0.5" y="3" width="1.5" height="2.5"/></svg>
        </button>
      </form>
    </footer>
  </main>

  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet card">
      <header class="top">
        <div class="sheet-title">Ayarlar</div>
        <button class="btn icon" id="closeSheet" aria-label="Kapat">
          <svg viewBox="0 0 8 8" width="11" height="11" shape-rendering="crispEdges"><path d="M0 1L1 0L4 3L7 0L8 1L5 4L8 7L7 8L4 5L1 8L0 7L3 4Z"/></svg>
        </button>
      </header>

      <div class="setting">
        <span>Adın</span>
        <input id="nameInput" class="name-input" type="text" maxlength="30" autocomplete="given-name" placeholder="adın">
      </div>
      <div class="setting">
        <span>Günlük hedef</span>
        <div class="stepper" data-key="dailyGoal" data-step="1" data-min="1" data-max="100">
          <button class="btn sm" data-d="-1">−</button><b></b><button class="btn sm" data-d="1">+</button>
        </div>
      </div>
      <div class="setting">
        <span>Toplam hedef</span>
        <div class="stepper" data-key="totalGoal" data-step="50" data-min="50" data-max="10000">
          <button class="btn sm" data-d="-1">−</button><b></b><button class="btn sm" data-d="1">+</button>
        </div>
      </div>
      <div class="setting">
        <span>Soru sıklığı</span>
        <div class="seg" id="freqSeg">
          <button class="btn sm" data-v="often">sık</button><button class="btn sm" data-v="normal">normal</button><button class="btn sm" data-v="rare">seyrek</button>
        </div>
      </div>
      <div class="setting">
        <span>Ses efektleri</span>
        <div class="seg" id="sfxSeg">
          <button class="btn sm" data-v="on">açık</button><button class="btn sm" data-v="off">kapalı</button>
        </div>
      </div>
      <div class="setting">
        <span>Sesli okuma</span>
        <div class="seg" id="voiceSeg">
          <button class="btn sm" data-v="on">açık</button><button class="btn sm" data-v="off">kapalı</button>
        </div>
      </div>

      <div class="profile">
        <div class="list-head"><span>Kanka seni nasıl tanıyor</span>
          <span class="pbtns"><button class="btn sm" id="profileRefresh">yenile</button><button class="btn sm" id="profileForget">unut</button></span></div>
        <div id="profileBox"></div>
      </div>

      <div class="profile">
        <div class="list-head"><span>Senkron · iPad ⇄ telefon</span></div>
        <div id="syncBox"></div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="list-head">
        <span>Hafızadaki kelimeler</span>
        <input id="search" type="search" placeholder="ara…" autocomplete="off">
      </div>
      <ul class="word-list" id="wordList"></ul>

      <div class="sheet-actions">
        <button class="btn sm" id="exportBtn">dışa aktar</button>
        <label class="btn sm">içe aktar<input type="file" id="importFile" accept="application/json" hidden></label>
        <button class="btn sm danger" id="resetBtn">sıfırla</button>
      </div>
    </div>
  </div>

  <script src="js/sfx.js?v=18"></script>
  <script src="js/dict.js?v=18"></script>
  <script src="js/ai.js?v=18"></script>
  <script src="js/translate.js?v=18"></script>
  <script src="js/reader.js?v=18"></script>
  <script src="js/scene.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
</body>
</html>
